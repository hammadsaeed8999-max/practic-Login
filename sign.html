<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing Form</title>
    <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">

</head>
<body>
    
    <div class="main">
        <div class="form">
          <div class="heading1">
               <h1>Sign In</h1>
          </div>
  <!-- Form Tag Start -->
   <form>
 
        <div class="form-group">
            <label for="username">User Name</label>
             <i class="fa-solid fa-user" style="color: rgb(0, 0, 0);"></i>
            <input type="text" name="name" id="name" placeholder="Full Name">
        </div>

        <div class="form-group">
            <label for="fathername">Father Name</label>
             <i class="fa-solid fa-user" style="color: rgb(0, 0, 0);"></i>
            <input type="text" name="Father-name" id="Father-name" placeholder="Father Name">
        </div>

        <div class="form-group">
            <label for="Email">Email</label>
               <i class="fa-brands fa-meetup" style="color: rgb(12, 11, 11);"></i>
            <input type="Email" name="Email" id="Email" placeholder="Email">
        </div>

        <div class="form-group">
            <label for="Password">Password</label>
                <i class="fa-solid fa-key" style="color: rgb(12, 11, 11);"></i>
            <input type="password" name="password" id="password" placeholder="Password">
        </div>

          <div class="form-group">
            <label for="Password">Confirm Password</label>
                <i class="fa-solid fa-key" style="color: rgb(12, 11, 11);"></i>
            <input type="password" name="password" id="password" placeholder="Confirm Password">
        </div>
        
        
        <div class="form-group2">
            <button type="submit"><a href="index.html">Submint</a></button>
        </div>
   </form>
        </div>

        <div class="img">
          <img src="code.png" alt="">
        </div>
    </div>

</body>
</html>
